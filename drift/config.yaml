# Task 3 - Embedding + DriftLens + MCD-DD configuration.
# Relative paths are resolved from the repository root (same convention as ingestion/ and spark/).

input:
  # A single JSONL file (e.g. windows_all.jsonl) or Task 2's folder output/windows (batch_id=*/part-*.json)
  windows_path: "windows_all.jsonl"

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"   # 384-d
  batch_size: 256
  device: ""                             # "" = auto (cuda if available), or "cpu" / "cuda"
  cache_dir: "output/embeddings"         # per-window .npy cache, "" disables it

driftlens:
  reference_windows: 14                  # first N windows present in the stream (not N calendar days)
  threshold_fraction: 0.5                # share of reference tweets held out for threshold calibration
  pca_components: 150
  window_sample_size: 1000               # tweets per window used for scoring (FDD depends on sample size)
  n_calibration: 1000                    # random in-distribution windows drawn for calibration
  percentile: 99                         # threshold = this percentile of calibration FDDs
  seed: 42

mcddd:
  enabled: true
  device: ""                             # "" = auto (cuda if usable), or "cpu" / "cuda"
  hidden_dim: 128                        # Deep Sets encoder hidden layer width
  output_dim: 64                         # concept embedding dimensionality
  n_encoders: 5                          # ensemble of independently trained encoders (one was seed-dependent)
  lr: 0.001                              # Adam learning rate
  lambda_gp: 1.0                         # gradient penalty weight (paper default 1; 0 = off)
  lipschitz_k: 1.0                       # target per-item gradient norm for the penalty
  eps_small: 0.03                        # weak-negative noise std (standardised units)
  eps_big: 0.3                           # strong-negative noise std (paper's 1:10 ratio; 1.0 killed sensitivity)
  n_sub_windows: 5                       # sub-windows used only when no per-window grouping is available
  sample_set_size: 100                   # items per set in contrastive training pairs (paper m)
  k_pairs: 10                            # contrastive pairs per sub-window per step (paper k = 10)
  train_epochs: 100                      # offline gradient steps, fresh pairs each step (GPU: ~seconds)
  scoring_sample_size: 1000              # max tweets per window used for scoring (= DriftLens window_sample_size)
  context_windows: 10                    # newest window is compared with this many previous windows (max MCD)
  holdout_fraction: 0.8                  # share of each reference window kept out of training; must hold (context_windows+1)*scoring_sample_size rows
  n_calibration: 500                     # bootstrap draws for the alarm threshold
  percentile: 99.0                       # threshold = this percentile of in-distribution MCDs
  online_training: false                 # one encoder step per scored window (+ recalibration) if true
  seed: 42
  model_path: "output/drift/mcddd.pt"   # saved encoder, standardisation, reference pool + thresholds

output:
  reference_path: "output/drift/reference.npz"
  scores_path: "output/drift/driftlens.jsonl"

follow:
  poll_seconds: 10                       # --follow: how often to look for new windows
